<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="The Hollow Crown: District 2, floor 4, the Intake. Playable in your browser.">
  <title>The Hollow Crown · Floor 4</title>
  <link rel="icon" href="regent.png">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #canvas { display: block; width: 100vw; height: 100vh; outline: none; image-rendering: pixelated; }
    #cover {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #000; color: #d8d2c4; font: 15px/1.4 system-ui, sans-serif; text-align: center; padding: 16px;
    }
    #cover[hidden] { display: none; }
    #cover h1 { margin: 0; font: 600 22px/1.2 Georgia, serif; color: #f1e7cf; letter-spacing: .02em; }
    #progress { width: min(320px, 80vw); height: 6px; appearance: none; border: 0; background: #222; }
    #progress::-webkit-progress-bar { background: #222; }
    #progress::-webkit-progress-value { background: #d8a34a; }
    #progress::-moz-progress-bar { background: #d8a34a; }
  </style>
  
</head>
<body>
  <canvas id="canvas" tabindex="0">Your browser can't show the game.</canvas>
  <div id="cover">
    <h1>The Hollow Crown · Floor 4</h1>
    <progress id="progress" aria-label="Download progress"></progress>
    <p id="status" role="status">Loading…</p>
    <noscript>Enable JavaScript to play.</noscript>
  </div>
  <script src="index.js"></script>
  <script>
    const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1922472,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    config.args = ['--', '--solo', '--district=2', '--new-art', '--class=sworn', '--hd-quality=web', ...new URLSearchParams(location.search).getAll('arg')];
    const canvas = document.getElementById('canvas');
    const cover = document.getElementById('cover');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');

    if (typeof Engine === 'undefined') {
      status.textContent = 'The game could not load. Reload the page to try again.';
      progress.hidden = true;
    } else if (Engine.getMissingFeatures({ threads: false }).length) {
      status.textContent = 'This game needs a browser with WebGL 2 and WebAssembly.';
      progress.hidden = true;
    } else {
      // The game says how its own load is going (HdStage: it builds the floor a part at a time, then prepares
      // the lighting one view a frame) and when it is ready; the cover stays up until then.
      let heard = false;
      const show = () => { cover.hidden = true; canvas.focus(); };
      window.hcLoading = (label, done, total) => {
        heard = true;
        progress.max = Math.max(total, 1);
        progress.value = done;
        status.textContent = total > 1 ? `${label}… ${done} of ${total}` : `${label}…`;
      };
      window.hcReady = show;
      const engine = new Engine(config);
      engine.startGame({
        onProgress(current, total) {
          if (total > 0) {
            progress.max = total;
            progress.value = current;
            status.textContent = current >= total ? 'Starting…' : `Loading… ${Math.round(current / 1e6)} of ${Math.round(total / 1e6)} MB`;
          }
        },
      }).then(() => {
        // The game may already be reporting its own progress by now; don't write over it.
        if (!heard) {
          status.textContent = 'Starting…';
          progress.removeAttribute('value');
        }
        // A build that never reports (no HD scenery) is shown after a while anyway, and so is a load that stalls.
        setTimeout(() => { if (!heard) show(); }, 30000);
        setTimeout(show, 600000);
      }).catch((error) => {
        console.error(error);
        progress.hidden = true;
        status.textContent = 'The game could not start. Reload the page to try again.';
      });
    }
    canvas.addEventListener('pointerdown', () => canvas.focus());
  </script>
</body>
</html>
